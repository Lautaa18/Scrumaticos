<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glosario · SCrumáticos</title>
  <meta name="description" content="Definiciones de términos clave de calidad y desarrollo de software.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/layout.js" defer></script>
  <script src="js/glosario.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="glosario">
  <main id="contenido">
    <section class="page-head">
      <div class="contenedor">
        <nav class="migas" aria-label="Ruta"><a href="index.html">Inicio</a> / Recursos y Aprendizaje / Glosario</nav>
        <span class="etiqueta">Recursos y aprendizaje</span>
        <h1>Glosario <span class="degradado">A–Z</span></h1>
        <p class="bajada">Definiciones cortas de los términos que usamos en el portal. Buscá una palabra o elegí una letra.</p>
      </div>
    </section>

    <section class="bloque" aria-labelledby="t-glosario">
      <div class="contenedor">
        <h2 id="t-glosario" class="sr-only">Términos</h2>
        <div class="buscador">
          <label for="buscar-termino">Buscar un término</label>
          <input id="buscar-termino" type="search" placeholder="Por ejemplo: sprint, métrica, prueba" autocomplete="off" data-buscar>
          <span class="suave" data-estado-busqueda aria-live="polite"></span>
        </div>
        <nav aria-label="Índice alfabético"><ul class="letras" data-letras></ul></nav>
        <div data-glosario></div>
        <p class="aviso sin-resultados" data-sin-resultados hidden>Sin resultados. Probá con otra palabra o revisá cómo está escrita.</p>
      </div>
    </section>
  </main>
</body>
</html>

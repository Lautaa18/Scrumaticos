<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encuesta de preferencias metodológicas · SCrumáticos</title>
  <meta name="description" content="Respondé seis preguntas sobre tu proyecto y descubrí qué metodología te conviene.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/layout.js" defer></script>
  <script src="js/encuesta.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="encuesta">
  <main id="contenido">
    <section class="page-head">
      <div class="contenedor">
        <nav class="migas" aria-label="Ruta"><a href="index.html">Inicio</a> / Herramientas JS / Encuesta</nav>
        <span class="etiqueta">Herramientas interactivas</span>
        <h1>¿Qué metodología <span class="degradado">te conviene?</span></h1>
        <p class="bajada">Respondé seis preguntas sobre tu proyecto. Al final te mostramos qué tanto coincide con Scrum, Kanban y Cascada.</p>
      </div>
    </section>

    <section class="bloque" aria-labelledby="t-encuesta">
      <div class="contenedor">
        <h2 id="t-encuesta" class="sr-only">Encuesta</h2>
        <div class="wizard" data-encuesta>
          <div class="progreso" role="progressbar" aria-label="Progreso de la encuesta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div></div></div>
          <p class="paso-txt" data-paso></p>
          <div data-pregunta></div>
          <p class="aviso error" data-aviso-encuesta role="alert" hidden></p>
          <div class="wizard-botones">
            <button class="btn-sec" type="button" data-anterior>← Anterior</button>
            <button class="btn" type="button" data-siguiente>Siguiente</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>

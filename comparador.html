<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador de metodologías · SCrumáticos</title>
  <meta name="description" content="Compará metodologías tradicionales y ágiles en una tabla interactiva.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/layout.js" defer></script>
  <script src="js/comparador.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="comparador">
  <main id="contenido">
    <section class="page-head">
      <div class="contenedor">
        <nav class="migas" aria-label="Ruta"><a href="index.html">Inicio</a> / Herramientas JS / Comparador</nav>
        <span class="etiqueta">Herramientas interactivas</span>
        <h1>Comparador de <span class="degradado">metodologías</span></h1>
        <p class="bajada">Elegí dos o más metodologías y mirá sus diferencias en enfoque, entregas, roles, flexibilidad y más.</p>
      </div>
    </section>

    <section class="bloque" aria-labelledby="t-comparar">
      <div class="contenedor">
        <h2 id="t-comparar" class="sr-only">Comparar</h2>
        <form data-comparador>
          <fieldset class="selector"><legend>Metodologías a comparar</legend></fieldset>
          <p style="margin-top:14px"><button class="btn-sec" type="reset">Limpiar selección</button></p>
        </form>
        <p class="aviso" data-aviso-comparador aria-live="polite"></p>
        <div data-tabla-comparador></div>
      </div>
    </section>
  </main>
</body>
</html>
